[project]
name = "duckflock-explorer-workspace"
version = "0.5.0"
description = "uv workspace root for duckflock (core library + Streamlit UI)"
requires-python = ">=3.11,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
duckflock-core = { workspace = true }
duckflock-ui = { workspace = true }

[dependency-groups]
dev = [
    "duckflock-core",
    "duckflock-ui",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["duckflock_core", "duckflock_ui"]

[tool.pytest.ini_options]
testpaths = [
    "packages/duckflock-core/tests",
    "packages/duckflock-ui/tests",
]
timeout = 300
addopts = "-ra"
