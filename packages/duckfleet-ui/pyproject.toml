[project]
name = "duckfleet-ui"
version = "0.2.0"
description = "Streamlit UI for duckfleet"
requires-python = ">=3.11,<3.14"
dependencies = [
    "duckfleet-core",
    "streamlit>=1.66,<2",
    "plotly>=5.24",
    "pandas>=2.2,<4",
    "pyarrow>=17",
]

[project.scripts]
duckfleet-ui = "duckfleet_ui.launch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duckfleet_ui"]
