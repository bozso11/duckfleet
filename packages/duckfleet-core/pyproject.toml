[project]
name = "duckfleet-core"
version = "0.1.1"
description = "Discover, profile and fingerprint a folder tree of DuckDB files (no UI dependency)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "duckdb>=1.1,<2",
    "pydantic>=2.7,<3",
    "platformdirs>=4",
    "psutil>=5.9",
]

[project.scripts]
duckfleet = "duckfleet_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duckfleet_core"]
