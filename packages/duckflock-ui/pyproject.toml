[project]
name = "duckflock-ui"
version = "0.5.0"
description = "Streamlit UI for duckflock"
requires-python = ">=3.11,<3.14"
dependencies = [
    "duckflock-core",
    "streamlit>=1.66,<2",
    "plotly>=5.24",
    "pandas>=2.2,<4",
    "pyarrow>=17",
]

[project.scripts]
duckflock-ui = "duckflock_ui.launch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duckflock_ui"]
